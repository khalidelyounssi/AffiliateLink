spring.application.name=AffiliateLink

# Docker Compose
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-and-stop

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8081

# Durable events: Flyway owns the registry schema.
spring.modulith.events.republish-outstanding-events-on-restart=true

# Logging
logging.file.name=logs/affiliatelink.log
logging.level.com.affiliateLink=DEBUG

# Local SMTP captured by Mailpit (no delivery to real inboxes).
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.mail.from=noreply@affiliatelink.test
